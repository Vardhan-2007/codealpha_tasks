<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Career Guide Bot</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #0e0e11;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      font-family: 'Segoe UI', sans-serif;
    }

    .chat-wrapper {
      width: 430px;
      height: 660px;
      background: #1a1a20;
      border-radius: 24px;
      border: 1px solid #2e2e38;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    }

    /* Header */
    .header {
      background: #222229;
      padding: 18px 24px;
      border-bottom: 1px solid #2e2e38;
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .avatar {
      width: 44px;
      height: 44px;
      background: linear-gradient(135deg, #7c6ef7, #f76e8c);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
    }
    .header-info h1 { font-size: 15px; color: #eaeaf0; font-weight: 600; }
    .header-info p  { font-size: 12px; color: #4ade80; margin-top: 3px; }

    /* Topics button */
    .topics-btn {
      margin-left: auto;
      background: transparent;
      border: 1px solid #2e2e38;
      color: #a0a0c0;
      padding: 7px 14px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      font-family: 'Segoe UI', sans-serif;
      transition: all 0.2s;
    }
    .topics-btn:hover { border-color: #7c6ef7; color: #7c6ef7; }

    /* Topics panel */
    .topics-panel {
      background: #1e1e2e;
      border-bottom: 1px solid #2e2e38;
      padding: 14px 20px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      overflow-y: auto;
      max-height: 300px;
    }
    .topics-panel .panel-title {
      font-size: 11px;
      font-weight: 600;
      color: #7070a0;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      margin-bottom: 4px;
    }
    .topic-item {
      background: transparent;
      border: 1px solid #2e2e38;
      color: #c0c0e0;
      padding: 10px 14px;
      border-radius: 10px;
      font-size: 13px;
      text-align: left;
      cursor: pointer;
      font-family: 'Segoe UI', sans-serif;
      transition: all 0.2s;
      width: 100%;
    }
    .topic-item:hover {
      background: rgba(124, 110, 247, 0.1);
      border-color: #7c6ef7;
      color: #eaeaf0;
    }

    /* Messages */
    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .messages::-webkit-scrollbar { width: 4px; }
    .messages::-webkit-scrollbar-thumb { background: #2e2e38; border-radius: 2px; }

    /* Bubbles */
    .message {
      display: flex;
      gap: 8px;
      animation: fadeIn 0.25s ease;
    }
    .message.user { flex-direction: row-reverse; }

    .bubble {
      max-width: 75%;
      padding: 12px 16px;
      border-radius: 18px;
      font-size: 14px;
      line-height: 1.65;
    }
    .bot .bubble {
      background: #1e1e2e;
      border: 1px solid #2e2e38;
      color: #eaeaf0;
      border-top-left-radius: 4px;
    }
    .user .bubble {
      background: #7c6ef7;
      color: #fff;
      border-top-right-radius: 4px;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* Typing dots */
    .dot {
      display: inline-block;
      width: 7px; height: 7px;
      background: #7070a0;
      border-radius: 50%;
      animation: bounce 1s infinite;
    }
    .dot:nth-child(2) { animation-delay: 0.2s; }
    .dot:nth-child(3) { animation-delay: 0.4s; }

    @keyframes bounce {
      0%, 80%, 100% { transform: translateY(0); }
      40%           { transform: translateY(-6px); }
    }

    /* Welcome card */
    .welcome-card {
      background: #1e1e2e;
      border: 1px solid #2e2e38;
      border-radius: 16px;
      padding: 16px;
      margin-top: 4px;
      font-size: 13px;
      color: #a0a0c0;
      line-height: 1.8;
    }
    .welcome-card .card-title {
      font-size: 13px;
      font-weight: 600;
      color: #7c6ef7;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .topics-grid {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 12px;
      margin-bottom: 14px;
    }
    .topic-group { display: flex; flex-direction: column; gap: 4px; }
    .topic-group .topic-heading {
      font-size: 12px; font-weight: 600;
      color: #eaeaf0; margin-bottom: 2px;
    }
    .topic-group span { font-size: 11px; color: #7070a0; }
    .divider { border: none; border-top: 1px solid #2e2e38; margin: 12px 0; }

    /* Chips */
    .chips-wrapper {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 10px;
    }
    .chip {
      background: transparent;
      border: 1px solid #2e2e38;
      color: #a0a0c0;
      padding: 7px 14px;
      border-radius: 20px;
      font-size: 12px;
      cursor: pointer;
      font-family: 'Segoe UI', sans-serif;
      transition: all 0.2s;
    }
    .chip:hover {
      border-color: #7c6ef7;
      color: #eaeaf0;
      background: rgba(124, 110, 247, 0.1);
    }

    /* Input area */
    .input-area {
      padding: 16px 20px;
      background: #222229;
      border-top: 1px solid #2e2e38;
      display: flex;
      gap: 10px;
    }
    .input-area input {
      flex: 1;
      background: #0e0e11;
      border: 1px solid #2e2e38;
      color: #eaeaf0;
      padding: 12px 16px;
      border-radius: 12px;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
    }
    .input-area input:focus { border-color: #7c6ef7; }
    .input-area input::placeholder { color: #7070a0; }
    .input-area button {
      background: #7c6ef7;
      color: #fff;
      border: none;
      padding: 12px 20px;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    .input-area button:hover { background: #8f82f9; }
  </style>
</head>
<body>

  <div class="chat-wrapper">

    <div class="header">
      <div class="avatar">💼</div>
      <div class="header-info">
        <h1>Career Guide Bot</h1>
        <p>● Online</p>
      </div>
      <button class="topics-btn" onclick="toggleTopics()">Topics</button>
    </div>

    <div class="topics-panel" id="topicsPanel" style="display:none;"></div>

    <div class="messages" id="messages"></div>

    <div class="input-area">
      <input
        type="text"
        id="userInput"
        placeholder="Ask about jobs, resumes, interviews..."
        autocomplete="off"
      />
      <button onclick="sendMessage()">Send</button>
    </div>

  </div>

  <script>

    const messagesEl = document.getElementById("messages");

    // ── All FAQ questions for Topics panel ──────────────────────────
    const topicQuestions = [
  "What is GATE?",
  "How can I join ISRO?",
  "What are PSU jobs?",
  "What is UPSC?",
  "How do I create an effective resume?",
  "What are the career options after B.Tech in AI and ML?"
];

    // ── Topics panel toggle ─────────────────────────────────────────
    function toggleTopics() {
      const panel = document.getElementById("topicsPanel");

      if (panel.style.display === "flex") {
        panel.style.display = "none";
        return;
      }

      // Build panel content only once
      if (panel.innerHTML === "") {
        const title = document.createElement("div");
        title.className = "panel-title";
        title.textContent = "What can I help you with?";
        panel.appendChild(title);

        topicQuestions.forEach(q => {
          const btn = document.createElement("button");
          btn.className = "topic-item";
          btn.textContent = q;
          btn.onclick = () => {
            panel.style.display = "none";
            sendMessage(q);           // ← sends real question to Flask
          };
          panel.appendChild(btn);
        });
      }

      panel.style.display = "flex";
      panel.style.flexDirection = "column";
    }

    // ── Welcome card with chips ─────────────────────────────────────
    function showChips() {
      const card = document.createElement("div");
      card.className = "welcome-card";
      card.innerHTML = `
        <div class="card-title">📌 Here's what I can help you with:</div>
        <div class="topics-grid">
          <div class="topic-group">
            <span class="topic-heading">🎓 Exams</span>
            <span>GATE exam</span>
            <span>UPSC & IAS</span>
            <span>Aptitude tests</span>
          </div>
          <div class="topic-group">
            <span class="topic-heading">💼 Career</span>
            <span>ISRO & DRDO</span>
            <span>PSU jobs</span>
            <span>AI/ML careers</span>
          </div>
          <div class="topic-group">
            <span class="topic-heading">📄 Skills</span>
            <span>Resume writing</span>
            <span>Cover letters</span>
            <span>Soft skills</span>
          </div>
        </div>
        <hr class="divider">
        <div class="card-title">💬 Try asking:</div>
      `;

      const chipsWrapper = document.createElement("div");
      chipsWrapper.className = "chips-wrapper";
      chipsWrapper.id = "chips";

      const chipQuestions = [
        "What is GATE?",
        "How can I join ISRO?",
        "What are PSU jobs?",
        "Career options after B.Tech in AI and ML?",
        "How to get an internship?",
        "How do I create an effective resume?"
      ];

      chipQuestions.forEach(q => {
        const chip = document.createElement("button");
        chip.className = "chip";
        chip.textContent = q;
        chip.onclick = () => {
          card.remove();              // remove welcome card
          sendMessage(q);            // ← sends real question to Flask
        };
        chipsWrapper.appendChild(chip);
      });

      card.appendChild(chipsWrapper);
      messagesEl.appendChild(card);
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    // ── Add a chat bubble ───────────────────────────────────────────
    function addMessage(role, text) {
      const div    = document.createElement("div");
      div.className = `message ${role}`;
      const bubble = document.createElement("div");
      bubble.className = "bubble";
      bubble.textContent = text;
      div.appendChild(bubble);
      messagesEl.appendChild(div);
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    // ── Typing indicator ────────────────────────────────────────────
    function showTyping() {
      const el = document.createElement("div");
      el.id = "typing";
      el.className = "message bot";
      el.innerHTML = `
        <div class="bubble" style="display:flex; gap:5px; align-items:center;">
          <span class="dot"></span>
          <span class="dot"></span>
          <span class="dot"></span>
        </div>`;
      messagesEl.appendChild(el);
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    function hideTyping() {
      const el = document.getElementById("typing");
      if (el) el.remove();
    }

    // ── Send message — accepts chip/topic text OR reads input box ───
    async function sendMessage(chipText = null) {
      const input = document.getElementById("userInput");
      const text  = chipText || input.value.trim();  // ← key fix
      if (!text) return;

      addMessage("user", text);
      input.value = "";
      showTyping();

      try {
        const response = await fetch("/ask", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ question: text })
        });
        const data = await response.json();
        hideTyping();
        addMessage("bot", data.answer);

      } catch (error) {
        hideTyping();
        addMessage("bot", "Something went wrong. Make sure your Flask server is running!");
      }
    }

    // ── Enter key to send ───────────────────────────────────────────
    document.getElementById("userInput")
      .addEventListener("keydown", e => {
        if (e.key === "Enter") sendMessage();
      });

    // ── Boot ────────────────────────────────────────────────────────
    addMessage("bot", "Hi! 👋 I'm your Career & Exam Guide Bot. I can help with GATE, UPSC, ISRO, PSU jobs, AI/ML careers, resumes, internships, and more!");
    showChips();

  </script>
</body>
</html>
