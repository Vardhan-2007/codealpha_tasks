<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Language Translator</title>
  <style>
  * { box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', Arial, sans-serif;
    background: linear-gradient(135deg, #74ebd5 0%, #5b9df9 50%, #4a90e2 100%);
    min-height: 100vh;
    margin: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .container {
    background: rgba(255, 255, 255, 0.55);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border: 1px solid rgba(255, 255, 255, 0.5);
    border-radius: 20px;
    padding: 32px;
    width: 100%;
    max-width: 600px;
    box-shadow: 0 8px 32px rgba(31, 38, 135, 0.15);
  }
  h2 {
    text-align: center;
    margin-top: 0;
    color: #1e3a5f;
    font-size: 26px;
    font-weight: 600;
  }
  textarea {
    width: 100%;
    height: 100px;
    font-size: 16px;
    padding: 14px;
    border: 1px solid rgba(255,255,255,0.6);
    background: rgba(255,255,255,0.6);
    border-radius: 12px;
    resize: vertical;
    font-family: inherit;
    color: #1e3a5f;
  }
  textarea::placeholder { color: rgba(30,58,95,0.6); }
  textarea:focus { outline: none; border-color: rgba(255,255,255,0.9); }
  .lang-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    margin: 16px 0;
  }
  select {
    flex: 1;
    padding: 10px;
    border-radius: 10px;
    border: 1px solid rgba(255,255,255,0.6);
    background: rgba(255,255,255,0.6);
    font-size: 14px;
    color: #1e3a5f;
  }
  select option { color: #333; }
  .swap-btn {
    background: rgba(255,255,255,0.6);
    border: 1px solid rgba(255,255,255,0.6);
    color: #1e3a5f;
    border-radius: 50%;
    width: 38px;
    height: 38px;
    font-size: 16px;
    cursor: pointer;
  }
  .swap-btn:hover { background: rgba(255,255,255,0.8); }
  .translate-btn {
    width: 100%;
    padding: 13px;
    background: #ffffff;
    color: #4a90e2;
    border: none;
    border-radius: 12px;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
  }
  .translate-btn:hover { background: #f0f7ff; }
  #output {
    margin-top: 16px;
    background: rgba(255,255,255,0.6);
    border: 1px solid rgba(255,255,255,0.6);
    border-radius: 12px;
    padding: 14px;
    min-height: 60px;
    font-size: 16px;
    color: #1e3a5f;
  }
  .action-row {
    display: flex;
    gap: 10px;
    margin-top: 12px;
  }
  .icon-btn {
    flex: 1;
    padding: 10px;
    border: 1px solid rgba(255,255,255,0.6);
    border-radius: 10px;
    background: rgba(255,255,255,0.6);
    color: #1e3a5f;
    cursor: pointer;
    font-size: 14px;
    font-weight: 600;
  }
  .icon-btn:hover { background: rgba(255,255,255,0.8); }
</style>
</head>
<body>
  <div class="container">
    <h2>🌐 Language Translator</h2>

    <textarea id="inputText" placeholder="Enter text to translate..."></textarea>

    <div class="lang-row">
      <select id="sourceLang">
        <option value="en">English</option>
        <option value="hi">Hindi</option>
        <option value="kn">Kannada</option>
        <option value="ta">Tamil</option>
        <option value="te">Telugu</option>
        <option value="mr">Marathi</option>
        <option value="bn">Bengali</option>
        <option value="gu">Gujarati</option>
        <option value="ml">Malayalam</option>
        <option value="pa">Punjabi</option>
        <option value="ur">Urdu</option>
        <option value="fr">French</option>
        <option value="es">Spanish</option>
        <option value="de">German</option>
        <option value="zh-Hans">Chinese (Simplified)</option>
        <option value="ja">Japanese</option>
        <option value="ar">Arabic</option>
        <option value="ru">Russian</option>
        <option value="pt">Portuguese</option>
      </select>

      <button class="swap-btn" onclick="swapLanguages()" title="Swap languages">⇄</button>

      <select id="targetLang">
        <option value="en">English</option>
        <option value="hi">Hindi</option>
        <option value="kn">Kannada</option>
        <option value="ta">Tamil</option>
        <option value="te">Telugu</option>
        <option value="mr">Marathi</option>
        <option value="bn">Bengali</option>
        <option value="gu">Gujarati</option>
        <option value="ml">Malayalam</option>
        <option value="pa">Punjabi</option>
        <option value="ur">Urdu</option>
        <option value="fr">French</option>
        <option value="es">Spanish</option>
        <option value="de">German</option>
        <option value="zh-Hans">Chinese (Simplified)</option>
        <option value="ja">Japanese</option>
        <option value="ar">Arabic</option>
        <option value="ru">Russian</option>
        <option value="pt">Portuguese</option>
      </select>
    </div>

    <button class="translate-btn" onclick="translateText()">Translate</button>

    <div id="output">Translation will appear here...</div>

    <div class="action-row">
      <button id="copyBtn" class="icon-btn" onclick="copyText()">📋 Copy</button>
      <button id="speakBtn" class="icon-btn" onclick="speakText()">🔊 Speak</button>
    </div>
  </div>

  <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
